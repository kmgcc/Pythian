<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#E06B5E" />
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#FDFBF7" />

  <g id="header">
    <text x="60" y="50" font-family="Arial, sans-serif" font-size="12" fill="#B0A898">COURSE DEFENSE · 03</text>
    <path fill="#E06B5E" d="M61.50,65 H108.50 A1.50,1.50 0 0 1 110,66.50 V66.50 A1.50,1.50 0 0 1 108.50,68 H61.50 A1.50,1.50 0 0 1 60,66.50 V66.50 A1.50,1.50 0 0 1 61.50,65 Z" />
    <text x="60" y="108" font-family="Microsoft YaHei, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2D2A26">光谱有价值，但直接测量成本较高</text>
  </g>

  <text x="60" y="158" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#2D2A26">
    专业光谱仪难以在普通场景普及，因此尝试用更容易获得的环境特征，通过机器学习估计自然光相对光谱。
  </text>

  
  <g id="flow">
    <path fill="#3D8B5E" fill-opacity="0.08" d="M72,200 H248 A12,12 0 0 1 260,212 V368 A12,12 0 0 1 248,380 H72 A12,12 0 0 1 60,368 V212 A12,12 0 0 1 72,200 Z" />
    <text x="160" y="235" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#3D8B5E" text-anchor="middle">输入</text>
    <text x="80" y="270" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#2D2A26">天气 / 时间 / 地点</text>
    <text x="80" y="300" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#2D2A26">太阳高度角 / 方位角</text>
    <text x="80" y="330" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#2D2A26">室外照度</text>

    <line x1="270" y1="290" x2="340" y2="290" stroke="#E06B5E" stroke-width="3" marker-end="url(#arrowHead)" />

    <path fill="#E06B5E" fill-opacity="0.1" d="M362,230 H518 A12,12 0 0 1 530,242 V338 A12,12 0 0 1 518,350 H362 A12,12 0 0 1 350,338 V242 A12,12 0 0 1 362,230 Z" />
    <text x="440" y="280" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#E06B5E" text-anchor="middle">机器学习</text>
    <text x="440" y="310" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#8C8578" text-anchor="middle">回归模型</text>

    <line x1="540" y1="290" x2="610" y2="290" stroke="#E06B5E" stroke-width="3" marker-end="url(#arrowHead)" />

    <path fill="#8B6DB0" fill-opacity="0.08" d="M632,220 H808 A12,12 0 0 1 820,232 V348 A12,12 0 0 1 808,360 H632 A12,12 0 0 1 620,348 V232 A12,12 0 0 1 632,220 Z" />
    <text x="720" y="265" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#8B6DB0" text-anchor="middle">输出</text>
    <text x="640" y="300" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#2D2A26">自然光相对光谱</text>
    <text x="640" y="330" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#2D2A26">380–780 nm / 41 维</text>

    <line x1="830" y1="290" x2="900" y2="290" stroke="#E06B5E" stroke-width="3" marker-end="url(#arrowHead)" />

    <path fill="#D4940A" fill-opacity="0.08" d="M922,220 H1118 A12,12 0 0 1 1130,232 V348 A12,12 0 0 1 1118,360 H922 A12,12 0 0 1 910,348 V232 A12,12 0 0 1 922,220 Z" />
    <text x="1020" y="265" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#D4940A" text-anchor="middle">应用</text>
    <text x="930" y="300" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#2D2A26">目标光谱 − 自然光</text>
    <text x="930" y="330" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#2D2A26">→ 七通道 LED 补偿</text>
  </g>

  
  <path fill="#E06B5E" fill-opacity="0.06" d="M70,420 H1120 A10,10 0 0 1 1130,430 V470 A10,10 0 0 1 1120,480 H70 A10,10 0 0 1 60,470 V430 A10,10 0 0 1 70,420 Z" />
  <text x="80" y="456" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#E06B5E">
    目标：输入低成本环境特征，输出自然光相对光谱，并进一步用于照明补偿。
  </text>

  <g id="footer">
    <text x="60" y="690" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#B0A898">基于真实天光数据的自然光光谱估计与室内照明补偿设计</text>
    <text x="1220" y="690" font-family="Arial, sans-serif" font-size="12" fill="#B0A898" text-anchor="end">03 / 15</text>
  </g>
</svg>