<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FDFBF7"/>

  <g id="header">
    <text x="60" y="50" font-family="Arial, sans-serif" font-size="12" fill="#B0A898">COURSE DEFENSE · 04</text>
    <rect x="60" y="65" width="50" height="3" rx="1.5" fill="#3D8B5E"/>
    <text x="60" y="108" font-family="Microsoft YaHei, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2D2A26">把真实观测数据整理成可训练的数据表</text>
  </g>

  <!-- Three cards with DIFFERENT colors -->
  <g id="data-cards">
    <!-- Card 1: Green -->
    <rect x="60" y="135" width="370" height="200" rx="12" fill="#3D8B5E" fill-opacity="0.06"/>
    <rect x="60" y="135" width="370" height="6" rx="3" fill="#3D8B5E"/>
    <text x="80" y="175" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#3D8B5E">SKYSPECTRA 实测天光光谱</text>
    <text x="80" y="205" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#2D2A26">Zenodo record 8147546</text>
    <text x="80" y="235" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#2D2A26">水平天光光谱 + 元数据</text>
    <text x="80" y="265" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#2D2A26">重采样到 380–780 nm / 10 nm</text>

    <!-- Card 2: Teal -->
    <rect x="455" y="135" width="370" height="200" rx="12" fill="#2AA3A0" fill-opacity="0.06"/>
    <rect x="455" y="135" width="370" height="6" rx="3" fill="#2AA3A0"/>
    <text x="475" y="175" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2AA3A0">Open-Meteo 历史天气 API</text>
    <text x="475" y="205" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#2D2A26">按观测站经纬度和日期查询</text>
    <text x="475" y="235" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#2D2A26">云量、湿度、温度、降水</text>
    <text x="475" y="265" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#2D2A26">按最近整点与光谱对齐</text>

    <!-- Card 3: Orange -->
    <rect x="850" y="135" width="370" height="200" rx="12" fill="#E8842A" fill-opacity="0.06"/>
    <rect x="850" y="135" width="370" height="6" rx="3" fill="#E8842A"/>
    <text x="870" y="175" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#E8842A">公开 LED 光谱数据</text>
    <text x="870" y="205" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#2D2A26">用于七通道 LED 补偿模型</text>
    <text x="870" y="235" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#2D2A26">深蓝、青、绿、琥珀、红、暖白、冷白</text>
    <text x="870" y="265" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#8C8578">只用于补偿，不参与训练</text>
  </g>

  <!-- Processing flow -->
  <g id="flow">
    <text x="60" y="375" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#2D2A26">处理流程</text>
    <rect x="60" y="395" width="150" height="50" rx="8" fill="#3D8B5E" fill-opacity="0.1"/>
    <text x="135" y="425" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#3D8B5E" text-anchor="middle">文件合并</text>
    <text x="220" y="425" font-family="Arial, sans-serif" font-size="20" fill="#E8E0D4">→</text>
    <rect x="240" y="395" width="150" height="50" rx="8" fill="#2AA3A0" fill-opacity="0.1"/>
    <text x="315" y="425" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#2AA3A0" text-anchor="middle">时间对齐</text>
    <text x="400" y="425" font-family="Arial, sans-serif" font-size="20" fill="#E8E0D4">→</text>
    <rect x="420" y="395" width="150" height="50" rx="8" fill="#E8842A" fill-opacity="0.1"/>
    <text x="495" y="425" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#E8842A" text-anchor="middle">波长重采样</text>
    <text x="580" y="425" font-family="Arial, sans-serif" font-size="20" fill="#E8E0D4">→</text>
    <rect x="600" y="395" width="150" height="50" rx="8" fill="#8B6DB0" fill-opacity="0.1"/>
    <text x="675" y="425" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#8B6DB0" text-anchor="middle">缺失值处理</text>
    <text x="760" y="425" font-family="Arial, sans-serif" font-size="20" fill="#E8E0D4">→</text>
    <rect x="780" y="395" width="150" height="50" rx="8" fill="#D4940A" fill-opacity="0.1"/>
    <text x="855" y="425" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#D4940A" text-anchor="middle">特征编码</text>
    <text x="940" y="425" font-family="Arial, sans-serif" font-size="20" fill="#E8E0D4">→</text>
    <rect x="960" y="395" width="180" height="50" rx="8" fill="#3D8B5E" fill-opacity="0.15"/>
    <text x="1050" y="425" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="bold" fill="#3D8B5E" text-anchor="middle">建模数据表</text>
  </g>

  <!-- Key numbers with highlight -->
  <g id="numbers">
    <rect x="60" y="475" width="1160" height="110" rx="12" fill="#FFF8EE"/>

    <rect x="80" y="495" width="200" height="70" rx="8" fill="#FFF3B0"/>
    <text x="180" y="530" font-family="Consolas, Courier New, monospace" font-size="36" font-weight="bold" fill="#3D8B5E" text-anchor="middle">5664</text>
    <text x="180" y="555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#8C8578" text-anchor="middle">样本量</text>

    <rect x="310" y="495" width="160" height="70" rx="8" fill="#FFF3B0"/>
    <text x="390" y="530" font-family="Consolas, Courier New, monospace" font-size="36" font-weight="bold" fill="#2AA3A0" text-anchor="middle">41</text>
    <text x="390" y="555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#8C8578" text-anchor="middle">光谱维度</text>

    <rect x="500" y="495" width="240" height="70" rx="8" fill="#FFF3B0"/>
    <text x="620" y="530" font-family="Consolas, Courier New, monospace" font-size="36" font-weight="bold" fill="#E8842A" text-anchor="middle">2016–2018</text>
    <text x="620" y="555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#8C8578" text-anchor="middle">时间范围</text>

    <rect x="770" y="495" width="130" height="70" rx="8" fill="#FFF3B0"/>
    <text x="835" y="530" font-family="Consolas, Courier New, monospace" font-size="36" font-weight="bold" fill="#8B6DB0" text-anchor="middle">2</text>
    <text x="835" y="555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#8C8578" text-anchor="middle">观测站</text>

    <rect x="930" y="495" width="260" height="70" rx="8" fill="#FFF3B0"/>
    <text x="1060" y="530" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#2D2A26" text-anchor="middle">法国沃昂夫兰</text>
    <text x="1060" y="555" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#8C8578" text-anchor="middle">主要站点</text>
  </g>

  <g id="footer">
    <text x="60" y="690" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#B0A898">基于真实天光数据的自然光光谱估计与室内照明补偿设计</text>
    <text x="1220" y="690" font-family="Arial, sans-serif" font-size="12" fill="#B0A898" text-anchor="end">04 / 15</text>
  </g>
</svg>