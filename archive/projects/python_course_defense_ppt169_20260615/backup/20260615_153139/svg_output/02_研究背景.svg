<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="sectionAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E06B5E"/>
      <stop offset="100%" stop-color="#E06B5E" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="#FDFBF7"/>

  <!-- Header -->
  <g id="header">
    <text x="60" y="50" font-family="Arial, sans-serif" font-size="11" fill="#B0A898">COURSE DEFENSE · 02</text>
    <rect x="60" y="65" width="50" height="3" rx="1.5" fill="#E06B5E"/>
    <text x="60" y="100" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="bold" fill="#2D2A26">照明不只关乎"够不够亮"</text>
  </g>

  <!-- Three keyword progression -->
  <g id="keyword-progression">
    <!-- 亮度 -->
    <rect x="60" y="140" width="220" height="80" rx="12" fill="#FFF8EE"/>
    <text x="80" y="175" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="bold" fill="#E06B5E">亮度</text>
    <text x="80" y="200" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#8C8578">照度看"够不够亮"</text>

    <!-- Arrow -->
    <text x="295" y="185" font-family="Arial, sans-serif" font-size="24" fill="#E8E0D4">→</text>

    <!-- 色温 -->
    <rect x="330" y="140" width="220" height="80" rx="12" fill="#FFF8EE"/>
    <text x="350" y="175" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="bold" fill="#E06B5E">色温</text>
    <text x="350" y="200" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#8C8578">看冷暖，但不够细致</text>

    <!-- Arrow -->
    <text x="565" y="185" font-family="Arial, sans-serif" font-size="24" fill="#E8E0D4">→</text>

    <!-- 光谱 -->
    <rect x="600" y="140" width="260" height="80" rx="12" fill="#E06B5E" fill-opacity="0.1"/>
    <text x="620" y="175" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="bold" fill="#E06B5E">光谱</text>
    <text x="620" y="200" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#2D2A26">各波长能量分布，更接近光照质量</text>
  </g>

  <!-- Core message -->
  <g id="core-message">
    <text x="60" y="270" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#2D2A26">
      现代人越来越多时间处在室内，人工照明对学习、办公和生活体验都有影响。
    </text>
    <text x="60" y="300" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#2D2A26">
      常见照明调节主要关注亮度和色温，但这两个指标不能完整描述光的组成。
    </text>
    <text x="60" y="330" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#2D2A26">
      光谱能表示不同波长上的能量分布，是更细致的光照描述方式。
    </text>
  </g>

  <!-- Highlight box -->
  <rect x="60" y="360" width="600" height="50" rx="8" fill="#E06B5E" fill-opacity="0.08"/>
  <text x="80" y="390" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="bold" fill="#E06B5E">基于光谱的室内照明调节，是未来高质量照明的一个潜在方向。</text>

  <!-- Image -->
  <g id="chart-area">
    <rect x="720" y="140" width="500" height="340" rx="12" fill="#FFF8EE"/>
    <image href="../images/weather_spectrum_compare.png" x="730" y="150" width="480" height="320" preserveAspectRatio="xMidYMid meet"/>
    <text x="730" y="500" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#8C8578">不同天气下平均相对光谱存在差异</text>
  </g>

  <!-- Footer -->
  <g id="footer">
    <text x="60" y="690" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#B0A898">基于真实天光数据的自然光光谱估计与室内照明补偿设计</text>
    <text x="1220" y="690" font-family="Arial, sans-serif" font-size="11" fill="#B0A898" text-anchor="end">02 / 13</text>
  </g>
</svg>