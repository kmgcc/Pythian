<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="tealAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2AA3A0"/>
      <stop offset="100%" stop-color="#2AA3A0" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="#FDFBF7"/>

  <!-- Header -->
  <g id="header">
    <text x="60" y="50" font-family="Arial, sans-serif" font-size="11" fill="#B0A898">COURSE DEFENSE · 05</text>
    <rect x="60" y="65" width="50" height="3" rx="1.5" fill="#2AA3A0"/>
    <text x="60" y="100" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="bold" fill="#2D2A26">模型输入：低成本环境特征</text>
  </g>

  <!-- Left: Feature table -->
  <g id="feature-table">
    <rect x="60" y="130" width="520" height="420" rx="12" fill="#FFF8EE"/>
    <text x="80" y="165" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2AA3A0">输入特征（12 个）</text>

    <!-- Numeric features -->
    <text x="80" y="205" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2D2A26">数值特征</text>
    <text x="80" y="230" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#2D2A26">hour, month</text>
    <text x="80" y="255" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#2D2A26">solar_altitude, solar_azimuth</text>
    <text x="80" y="280" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#2D2A26">cloud_cover, humidity, temperature</text>
    <text x="80" y="305" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#2D2A26">precipitation, outdoor_lux</text>

    <!-- Divider -->
    <line x1="80" y1="325" x2="550" y2="325" stroke="#E8E0D4" stroke-width="1"/>

    <!-- Categorical features -->
    <text x="80" y="355" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2D2A26">类别特征（独热编码）</text>
    <text x="80" y="380" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#2D2A26">weather（天气类别）</text>
    <text x="80" y="405" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#2D2A26">sky_condition（天空状况）</text>
    <text x="80" y="430" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#2D2A26">location_code（观测站编号）</text>

    <!-- Divider -->
    <line x1="80" y1="450" x2="550" y2="450" stroke="#E8E0D4" stroke-width="1"/>

    <text x="80" y="480" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8C8578">数值特征标准化 + 类别特征独热编码</text>
  </g>

  <!-- Right: Feature importance chart -->
  <g id="feature-importance">
    <rect x="610" y="130" width="610" height="420" rx="12" fill="#FFF8EE"/>
    <text x="630" y="165" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2AA3A0">随机森林特征重要性</text>
    <image href="../images/feature_importance.png" x="620" y="180" width="590" height="350" preserveAspectRatio="xMidYMid meet"/>
    <text x="630" y="540" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#8C8578">outdoor_lux 占 54%，cloud_cover 占 9%，solar_azimuth 占 6%</text>
  </g>

  <!-- Footer -->
  <g id="footer">
    <text x="60" y="690" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#B0A898">基于真实天光数据的自然光光谱估计与室内照明补偿设计</text>
    <text x="1220" y="690" font-family="Arial, sans-serif" font-size="11" fill="#B0A898" text-anchor="end">05 / 13</text>
  </g>
</svg>