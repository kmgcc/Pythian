<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="brownAccent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C07040"/>
      <stop offset="100%" stop-color="#C07040" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="#FDFBF7"/>

  <!-- Header -->
  <g id="header">
    <text x="60" y="50" font-family="Arial, sans-serif" font-size="11" fill="#B0A898">COURSE DEFENSE · 09</text>
    <rect x="60" y="65" width="50" height="3" rx="1.5" fill="#C07040"/>
    <text x="60" y="100" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="bold" fill="#2D2A26">五个模型在同一数据上评价</text>
  </g>

  <!-- Metrics table -->
  <g id="metrics-table">
    <rect x="60" y="130" width="1160" height="200" rx="12" fill="#FFF8EE"/>

    <!-- Table header -->
    <rect x="60" y="130" width="1160" height="40" rx="12" fill="#C07040" fill-opacity="0.1"/>
    <text x="180" y="155" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" fill="#C07040" text-anchor="middle">模型</text>
    <text x="400" y="155" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" fill="#C07040" text-anchor="middle">MAE</text>
    <text x="560" y="155" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" fill="#C07040" text-anchor="middle">RMSE</text>
    <text x="720" y="155" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" fill="#C07040" text-anchor="middle">R²</text>
    <text x="880" y="155" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" fill="#C07040" text-anchor="middle">训练/s</text>
    <text x="1040" y="155" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold" fill="#C07040" text-anchor="middle">预测/s</text>

    <!-- Row 1: RF (highlighted) -->
    <rect x="60" y="175" width="1160" height="35" fill="#C07040" fill-opacity="0.06"/>
    <text x="180" y="198" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold" fill="#C07040" text-anchor="middle">Random Forest</text>
    <text x="400" y="198" font-family="Consolas, Courier New, monospace" font-size="15" fill="#2D2A26" text-anchor="middle">0.0051</text>
    <text x="560" y="198" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="bold" fill="#C07040" text-anchor="middle">0.0086</text>
    <text x="720" y="198" font-family="Consolas, Courier New, monospace" font-size="15" fill="#2D2A26" text-anchor="middle">0.959</text>
    <text x="880" y="198" font-family="Consolas, Courier New, monospace" font-size="15" fill="#2D2A26" text-anchor="middle">0.94</text>
    <text x="1040" y="198" font-family="Consolas, Courier New, monospace" font-size="15" fill="#2D2A26" text-anchor="middle">0.22</text>

    <!-- Row 2: KNN -->
    <text x="180" y="233" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#2D2A26" text-anchor="middle">KNN</text>
    <text x="400" y="233" font-family="Consolas, Courier New, monospace" font-size="15" fill="#2D2A26" text-anchor="middle">0.0050</text>
    <text x="560" y="233" font-family="Consolas, Courier New, monospace" font-size="15" fill="#2D2A26" text-anchor="middle">0.0090</text>
    <text x="720" y="233" font-family="Consolas, Courier New, monospace" font-size="15" fill="#2D2A26" text-anchor="middle">0.954</text>
    <text x="880" y="233" font-family="Consolas, Courier New, monospace" font-size="15" fill="#2D2A26" text-anchor="middle">0.03</text>
    <text x="1040" y="233" font-family="Consolas, Courier New, monospace" font-size="15" fill="#2D2A26" text-anchor="middle">0.14</text>

    <!-- Row 3: MLP -->
    <rect x="60" y="245" width="1160" height="35" fill="#C07040" fill-opacity="0.03"/>
    <text x="180" y="268" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#2D2A26" text-anchor="middle">MLP</text>
    <text x="400" y="268" font-family="Consolas, Courier New, monospace" font-size="15" fill="#2D2A26" text-anchor="middle">0.0058</text>
    <text x="560" y="268" font-family="Consolas, Courier New, monospace" font-size="15" fill="#2D2A26" text-anchor="middle">0.0095</text>
    <text x="720" y="268" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="bold" fill="#C07040" text-anchor="middle">0.962</text>
    <text x="880" y="268" font-family="Consolas, Courier New, monospace" font-size="15" fill="#2D2A26" text-anchor="middle">1.87</text>
    <text x="1040" y="268" font-family="Consolas, Courier New, monospace" font-size="15" fill="#2D2A26" text-anchor="middle">0.01</text>

    <!-- Row 4: DT -->
    <text x="180" y="303" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#2D2A26" text-anchor="middle">Decision Tree</text>
    <text x="400" y="303" font-family="Consolas, Courier New, monospace" font-size="15" fill="#2D2A26" text-anchor="middle">0.0054</text>
    <text x="560" y="303" font-family="Consolas, Courier New, monospace" font-size="15" fill="#2D2A26" text-anchor="middle">0.0124</text>
    <text x="720" y="303" font-family="Consolas, Courier New, monospace" font-size="15" fill="#2D2A26" text-anchor="middle">0.870</text>
    <text x="880" y="303" font-family="Consolas, Courier New, monospace" font-size="15" fill="#2D2A26" text-anchor="middle">0.03</text>
    <text x="1040" y="303" font-family="Consolas, Courier New, monospace" font-size="15" fill="#2D2A26" text-anchor="middle">0.00</text>

    <!-- Row 5: LR -->
    <rect x="60" y="315" width="1160" height="35" fill="#C07040" fill-opacity="0.03"/>
    <text x="180" y="338" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#2D2A26" text-anchor="middle">Linear Regression</text>
    <text x="400" y="338" font-family="Consolas, Courier New, monospace" font-size="15" fill="#2D2A26" text-anchor="middle">0.0225</text>
    <text x="560" y="338" font-family="Consolas, Courier New, monospace" font-size="15" fill="#E06B5E" text-anchor="middle">0.0376</text>
    <text x="720" y="338" font-family="Consolas, Courier New, monospace" font-size="15" fill="#E06B5E" text-anchor="middle">0.635</text>
    <text x="880" y="338" font-family="Consolas, Courier New, monospace" font-size="15" fill="#2D2A26" text-anchor="middle">0.03</text>
    <text x="1040" y="338" font-family="Consolas, Courier New, monospace" font-size="15" fill="#2D2A26" text-anchor="middle">0.01</text>
  </g>

  <!-- Chart -->
  <g id="model-chart">
    <rect x="60" y="350" width="1160" height="270" rx="12" fill="#FFF8EE"/>
    <image href="../images/model_compare.png" x="70" y="360" width="1140" height="250" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <!-- Conclusion -->
  <rect x="60" y="635" width="1160" height="40" rx="8" fill="#C07040" fill-opacity="0.08"/>
  <text x="80" y="660" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="bold" fill="#C07040">随机森林 RMSE 最低（0.0086），综合稳定性最好 → 最终选择</text>

  <!-- Footer -->
  <g id="footer">
    <text x="60" y="690" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#B0A898">基于真实天光数据的自然光光谱估计与室内照明补偿设计</text>
    <text x="1220" y="690" font-family="Arial, sans-serif" font-size="11" fill="#B0A898" text-anchor="end">09 / 13</text>
  </g>
</svg>