<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="coverDecor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8842A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#D4940A" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8842A"/>
      <stop offset="100%" stop-color="#D4940A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="#FDFBF7"/>

  <!-- Decorative gradient blob -->
  <ellipse cx="900" cy="300" rx="400" ry="350" fill="url(#coverDecor)"/>
  <ellipse cx="200" cy="600" rx="250" ry="200" fill="#E8842A" fill-opacity="0.05"/>

  <!-- Accent bar -->
  <rect x="80" y="200" width="6" height="120" rx="3" fill="url(#accentBar)"/>

  <!-- Title -->
  <text x="110" y="250" font-family="Microsoft YaHei, Arial, sans-serif" font-size="46" font-weight="bold" fill="#2D2A26">
    <tspan x="110" dy="0">基于真实天光数据的</tspan>
    <tspan x="110" dy="62">自然光光谱估计与</tspan>
    <tspan x="110" dy="62">室内照明补偿设计</tspan>
  </text>

  <!-- Subtitle -->
  <text x="110" y="470" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#8C8578">
    使用 Python 数据处理、PCA 降维与机器学习模型，估计自然光相对光谱
  </text>

  <!-- Divider line -->
  <line x1="110" y1="500" x2="400" y2="500" stroke="#E8E0D4" stroke-width="1"/>

  <!-- Info -->
  <text x="110" y="540" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#8C8578">
    <tspan x="110" dy="0">第24组</tspan>
    <tspan x="110" dy="30">课程名称：Python 应用开发基础</tspan>
    <tspan x="110" dy="30">小组成员：李安逸、黄奕滔</tspan>
  </text>

  <!-- Decorative spectrum curve -->
  <path d="M600,350 Q700,280 800,320 Q900,360 1000,300 Q1100,240 1200,280"
        fill="none" stroke="#E8842A" stroke-width="2" stroke-opacity="0.3"/>
  <path d="M600,370 Q700,310 800,340 Q900,370 1000,320 Q1100,270 1200,300"
        fill="none" stroke="#D4940A" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Key numbers -->
  <g id="key-numbers">
    <text x="700" y="520" font-family="Consolas, Courier New, monospace" font-size="36" font-weight="bold" fill="#E8842A">41</text>
    <text x="700" y="545" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#8C8578">波长点</text>

    <text x="850" y="520" font-family="Consolas, Courier New, monospace" font-size="36" font-weight="bold" fill="#E8842A">5664</text>
    <text x="850" y="545" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#8C8578">样本量</text>

    <text x="1050" y="520" font-family="Consolas, Courier New, monospace" font-size="36" font-weight="bold" fill="#E8842A">98.3%</text>
    <text x="1050" y="545" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#8C8578">PCA 累计方差</text>
  </g>

  <!-- Page number -->
  <text x="1220" y="690" font-family="Arial, sans-serif" font-size="11" fill="#B0A898">01 / 13</text>
</svg>