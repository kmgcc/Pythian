<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FDFBF7"/>

  <g id="header">
    <text x="60" y="50" font-family="Arial, sans-serif" font-size="12" fill="#B0A898">COURSE DEFENSE · 11</text>
    <rect x="60" y="65" width="50" height="3" rx="1.5" fill="#D4940A"/>
    <text x="60" y="108" font-family="Microsoft YaHei, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2D2A26">选择 Random Forest：效果与成本更平衡</text>
  </g>

  <!-- Left: Reasons -->
  <g id="reasons">
    <rect x="60" y="130" width="600" height="480" rx="12" fill="#FFF8EE"/>
    <rect x="60" y="130" width="600" height="5" rx="2" fill="#D4940A"/>

    <rect x="80" y="155" width="560" height="90" rx="8" fill="#E06B5E" fill-opacity="0.06"/>
    <text x="100" y="185" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#E06B5E">为什么不选线性回归</text>
    <text x="100" y="218" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#2D2A26">误差明显较大（RMSE=0.0376），不是简单线性关系</text>

    <line x1="80" y1="260" x2="620" y2="260" stroke="#E8E0D4" stroke-width="1"/>

    <rect x="80" y="275" width="560" height="90" rx="8" fill="#8B6DB0" fill-opacity="0.06"/>
    <text x="100" y="305" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#8B6DB0">为什么关注 MLP</text>
    <text x="100" y="338" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#2D2A26">代表神经网络路线，R² 略高但训练成本更高</text>

    <line x1="80" y1="380" x2="620" y2="380" stroke="#E8E0D4" stroke-width="1"/>

    <rect x="80" y="395" width="560" height="100" rx="8" fill="#D4940A" fill-opacity="0.08"/>
    <text x="100" y="428" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#D4940A">为什么最终选择 Random Forest</text>
    <text x="100" y="460" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#2D2A26">RMSE 最低、推理成本低、集成模型稳定性好</text>

    <line x1="80" y1="510" x2="620" y2="510" stroke="#E8E0D4" stroke-width="1"/>
    <text x="100" y="545" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2D2A26">选择依据</text>
    <text x="100" y="575" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#8C8578">不只看 R²，也结合 RMSE、训练成本和预测稳定性</text>
  </g>

  <!-- Right: Comparison -->
  <g id="compare">
    <rect x="690" y="130" width="530" height="480" rx="12" fill="#FFF8EE"/>
    <rect x="690" y="130" width="530" height="5" rx="2" fill="#C07040"/>

    <text x="710" y="175" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#C07040">RF vs MLP 关键对比</text>

    <rect x="710" y="200" width="490" height="110" rx="8" fill="#FFF3B0"/>
    <text x="730" y="235" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#C07040">Random Forest</text>
    <text x="730" y="265" font-family="Consolas, Courier New, monospace" font-size="17" fill="#2D2A26">RMSE: 0.0086 · R²: 0.959 · 训练: 0.94s</text>
    <text x="730" y="295" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#3D8B5E" font-weight="bold">RMSE 最低，综合最优 ✓</text>

    <rect x="710" y="330" width="490" height="110" rx="8" fill="#FFF8EE"/>
    <text x="730" y="365" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#8C8578">MLP</text>
    <text x="730" y="395" font-family="Consolas, Courier New, monospace" font-size="17" fill="#2D2A26">RMSE: 0.0095 · R²: 0.962 · 训练: 1.87s</text>
    <text x="730" y="425" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#8C8578">R² 略高但 RMSE 更大、训练更慢</text>

    <rect x="710" y="460" width="490" height="130" rx="8" fill="#D4940A" fill-opacity="0.06"/>
    <text x="730" y="495" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="bold" fill="#D4940A">核心结论</text>
    <text x="730" y="528" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#2D2A26">以实验结果为依据，不预先认定某个模型最好。</text>
    <text x="730" y="560" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" fill="#2D2A26">综合 RMSE、稳定性和推理成本选择。</text>
  </g>

  <g id="footer">
    <text x="60" y="690" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#B0A898">基于真实天光数据的自然光光谱估计与室内照明补偿设计</text>
    <text x="1220" y="690" font-family="Arial, sans-serif" font-size="12" fill="#B0A898" text-anchor="end">11 / 15</text>
  </g>
</svg>