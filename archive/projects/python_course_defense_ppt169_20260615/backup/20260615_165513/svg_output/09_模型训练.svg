<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FDFBF7"/>

  <g id="header">
    <text x="60" y="50" font-family="Arial, sans-serif" font-size="12" fill="#B0A898">COURSE DEFENSE · 09</text>
    <rect x="60" y="65" width="50" height="3" rx="1.5" fill="#C07040"/>
    <text x="60" y="108" font-family="Microsoft YaHei, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2D2A26">尝试多种课内模型，用结果选择方案</text>
  </g>

  <text x="60" y="150" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#8C8578">把光谱估计作为回归问题，尝试课程中涉及的模型路线</text>

  <!-- Five model cards with different colors -->
  <g id="models">
    <rect x="60" y="180" width="220" height="280" rx="12" fill="#64748B" fill-opacity="0.06"/>
    <rect x="60" y="180" width="220" height="5" rx="2" fill="#64748B"/>
    <text x="170" y="218" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#64748B" text-anchor="middle">Linear Regression</text>
    <text x="170" y="248" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#8C8578" text-anchor="middle">线性基准模型</text>
    <line x1="80" y1="268" x2="260" y2="268" stroke="#E8E0D4" stroke-width="1"/>
    <text x="80" y="300" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#2D2A26">观察问题是否接近线性关系</text>
    <text x="80" y="330" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#2D2A26">最简单的回归模型</text>
    <text x="80" y="360" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#E06B5E" font-weight="bold">误差明显较大</text>

    <rect x="300" y="180" width="220" height="280" rx="12" fill="#2AA3A0" fill-opacity="0.06"/>
    <rect x="300" y="180" width="220" height="5" rx="2" fill="#2AA3A0"/>
    <text x="410" y="218" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2AA3A0" text-anchor="middle">KNN</text>
    <text x="410" y="248" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#8C8578" text-anchor="middle">K 近邻回归</text>
    <line x1="320" y1="268" x2="500" y2="268" stroke="#E8E0D4" stroke-width="1"/>
    <text x="320" y="300" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#2D2A26">基于邻域的非参数模型</text>
    <text x="320" y="330" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#2D2A26">MAE 略低但 RMSE 不占优</text>

    <rect x="540" y="180" width="220" height="280" rx="12" fill="#E8842A" fill-opacity="0.06"/>
    <rect x="540" y="180" width="220" height="5" rx="2" fill="#E8842A"/>
    <text x="650" y="218" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#E8842A" text-anchor="middle">Decision Tree</text>
    <text x="650" y="248" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#8C8578" text-anchor="middle">决策树回归</text>
    <line x1="560" y1="268" x2="740" y2="268" stroke="#E8E0D4" stroke-width="1"/>
    <text x="560" y="300" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#2D2A26">单棵决策树，中间对比</text>
    <text x="560" y="330" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#2D2A26">稳定性不如集成模型</text>

    <rect x="780" y="180" width="220" height="280" rx="12" fill="#C07040" fill-opacity="0.08"/>
    <rect x="780" y="180" width="220" height="5" rx="2" fill="#C07040"/>
    <!-- Crown icon -->
    <image href="../images/icon_crown.svg" x="870" y="165" width="40" height="40" fill="#D4940A"/>
    <text x="890" y="218" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#C07040" text-anchor="middle">Random Forest</text>
    <text x="890" y="248" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#8C8578" text-anchor="middle">随机森林回归</text>
    <line x1="800" y1="268" x2="980" y2="268" stroke="#E8E0D4" stroke-width="1"/>
    <text x="800" y="300" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#2D2A26">集成学习模型</text>
    <text x="800" y="330" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#2D2A26">关注稳定性和非线性拟合</text>
    <rect x="800" y="350" width="180" height="30" rx="6" fill="#C07040" fill-opacity="0.15"/>
    <text x="890" y="370" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold" fill="#C07040" text-anchor="middle">最终选择 ✓</text>

    <rect x="1020" y="180" width="220" height="280" rx="12" fill="#8B6DB0" fill-opacity="0.06"/>
    <rect x="1020" y="180" width="220" height="5" rx="2" fill="#8B6DB0"/>
    <text x="1130" y="218" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#8B6DB0" text-anchor="middle">MLP</text>
    <text x="1130" y="248" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#8C8578" text-anchor="middle">神经网络回归</text>
    <line x1="1040" y1="268" x2="1220" y2="268" stroke="#E8E0D4" stroke-width="1"/>
    <text x="1040" y="300" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#2D2A26">更复杂的非线性模型</text>
    <text x="1040" y="330" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#2D2A26">R² 略高但 RMSE 更大</text>
  </g>

  <!-- Note -->
  <rect x="60" y="490" width="1160" height="90" rx="10" fill="#FFF8EE"/>
  <rect x="60" y="490" width="1160" height="5" rx="2" fill="#C07040"/>
  <text x="80" y="525" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="19" fill="#2D2A26">
    所有模型使用相同的数据划分、相同输入特征和相同 PCA 输出目标，最后用统一指标比较效果。
  </text>
  <text x="80" y="560" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#C07040" font-weight="bold">评价维度：MAE / RMSE / R² / 训练时间 / 推理时间</text>

  <g id="footer">
    <text x="60" y="690" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#B0A898">基于真实天光数据的自然光光谱估计与室内照明补偿设计</text>
    <text x="1220" y="690" font-family="Arial, sans-serif" font-size="12" fill="#B0A898" text-anchor="end">09 / 15</text>
  </g>
</svg>