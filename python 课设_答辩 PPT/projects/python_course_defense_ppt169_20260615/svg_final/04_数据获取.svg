    <text x="870" y="175" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#E8842A">公开 LED 光谱数据</text>
    <text x="870" y="205" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#2D2A26">用于七通道 LED 补偿模型</text>
    <text x="870" y="235" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#2D2A26">深蓝、青、绿、琥珀、红、暖白、冷白</text>
