    <path fill="#E8842A" fill-opacity="0.06" d="M862,135 H1208 A12,12 0 0 1 1220,147 V323 A12,12 0 0 1 1208,335 H862 A12,12 0 0 1 850,323 V147 A12,12 0 0 1 862,135 Z" />
