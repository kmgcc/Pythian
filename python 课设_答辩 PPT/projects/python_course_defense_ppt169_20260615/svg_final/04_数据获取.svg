    <text x="475" y="205" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#2D2A26">按观测站经纬度和日期查询</text>
    <text x="475" y="235" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#2D2A26">云量、湿度、温度、降水</text>
