<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FDFBF7"/>

  <g id="header">
    <text x="60" y="50" font-family="Arial, sans-serif" font-size="12" fill="#B0A898">COURSE DEFENSE · 12</text>
    <rect x="60" y="65" width="50" height="3" rx="1.5" fill="#C07040"/>
    <text x="60" y="108" font-family="Microsoft YaHei, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2D2A26">随机森林参数设置与调优</text>
  </g>

  <!-- Left: Parameters -->
  <g id="params">
    <rect x="60" y="130" width="560" height="460" rx="12" fill="#FFF8EE"/>
    <rect x="60" y="130" width="560" height="5" rx="2" fill="#C07040"/>
    <text x="80" y="170" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#C07040">关键参数</text>

    <rect x="80" y="195" width="520" height="60" rx="8" fill="#C07040" fill-opacity="0.06"/>
    <text x="100" y="225" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#C07040">n_estimators</text>
    <text x="100" y="248" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#2D2A26">决策树数量，越多越稳定但训练越慢</text>

    <rect x="80" y="270" width="520" height="60" rx="8" fill="#D4940A" fill-opacity="0.06"/>
    <text x="100" y="300" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#D4940A">max_depth</text>
    <text x="100" y="323" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#2D2A26">树的最大深度，控制模型复杂度</text>

    <rect x="80" y="345" width="520" height="60" rx="8" fill="#8B6DB0" fill-opacity="0.06"/>
    <text x="100" y="375" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#8B6DB0">min_samples_split</text>
    <text x="100" y="398" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#2D2A26">内部节点再分裂所需最小样本数</text>

    <rect x="80" y="420" width="520" height="60" rx="8" fill="#3D8B5E" fill-opacity="0.06"/>
    <text x="100" y="450" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#3D8B5E">random_state</text>
    <text x="100" y="473" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#2D2A26">随机种子，保证结果可复现</text>

    <text x="80" y="530" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#8C8578">具体数值按代码实际调优结果填写</text>
  </g>

  <!-- Right: Tuning process -->
  <g id="tuning">
    <rect x="650" y="130" width="570" height="460" rx="12" fill="#FFF8EE"/>
    <rect x="650" y="130" width="570" height="5" rx="2" fill="#D4940A"/>
    <text x="670" y="170" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#D4940A">调优过程</text>

    <rect x="670" y="195" width="530" height="70" rx="8" fill="#FFF3B0"/>
    <text x="690" y="225" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#D4940A">1. 参数对比实验</text>
    <text x="690" y="250" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#2D2A26">固定其他参数，逐一测试各参数的影响</text>

    <rect x="670" y="280" width="530" height="70" rx="8" fill="#C07040" fill-opacity="0.06"/>
    <text x="690" y="310" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#C07040">2. 交叉验证</text>
    <text x="690" y="335" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#2D2A26">使用 K 折交叉验证评估参数组合稳定性</text>

    <rect x="670" y="365" width="530" height="70" rx="8" fill="#8B6DB0" fill-opacity="0.06"/>
    <text x="690" y="395" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#8B6DB0">3. 选择最优组合</text>
    <text x="690" y="420" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#2D2A26">综合 RMSE 和训练时间选择最佳参数</text>

    <rect x="670" y="450" width="530" height="70" rx="8" fill="#3D8B5E" fill-opacity="0.06"/>
    <text x="690" y="480" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#3D8B5E">4. 最终模型</text>
    <text x="690" y="505" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#2D2A26">使用调优后的参数训练最终模型</text>

    <text x="670" y="560" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#8C8578">不只是用默认参数，而是通过实验找到更合适的配置</text>
  </g>

  <g id="footer">
    <text x="60" y="690" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#B0A898">基于真实天光数据的自然光光谱估计与室内照明补偿设计</text>
    <text x="1220" y="690" font-family="Arial, sans-serif" font-size="12" fill="#B0A898" text-anchor="end">12 / 15</text>
  </g>
</svg>