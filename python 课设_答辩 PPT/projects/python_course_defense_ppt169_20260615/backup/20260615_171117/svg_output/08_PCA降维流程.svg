<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FDFBF7"/>

  <g id="header">
    <text x="60" y="50" font-family="Arial, sans-serif" font-size="12" fill="#B0A898">COURSE DEFENSE · 08</text>
    <rect x="60" y="65" width="50" height="3" rx="1.5" fill="#8B6DB0"/>
    <text x="60" y="108" font-family="Microsoft YaHei, Arial, sans-serif" font-size="38" font-weight="bold" fill="#2D2A26">PCA 降维流程</text>
  </g>

  <!-- Flow steps with different colors -->
  <g id="flow">
    <rect x="60" y="140" width="1160" height="160" rx="12" fill="#FFF8EE"/>
    <rect x="60" y="140" width="1160" height="5" rx="2" fill="#8B6DB0"/>

    <rect x="80" y="165" width="160" height="110" rx="10" fill="#8B6DB0" fill-opacity="0.12"/>
    <text x="160" y="210" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#8B6DB0" text-anchor="middle">原始光谱</text>
    <text x="160" y="240" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#8C8578" text-anchor="middle">41 维</text>

    <text x="255" y="225" font-family="Arial, sans-serif" font-size="24" fill="#E8E0D4">→</text>

    <rect x="280" y="165" width="160" height="110" rx="10" fill="#D4940A" fill-opacity="0.12"/>
    <text x="360" y="210" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#D4940A" text-anchor="middle">标准化</text>
    <text x="360" y="240" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#8C8578" text-anchor="middle">StandardScaler</text>

    <text x="455" y="225" font-family="Arial, sans-serif" font-size="24" fill="#E8E0D4">→</text>

    <rect x="480" y="165" width="160" height="110" rx="10" fill="#E8842A" fill-opacity="0.12"/>
    <text x="560" y="210" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#E8842A" text-anchor="middle">PCA 降维</text>
    <text x="560" y="240" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#8C8578" text-anchor="middle">5 个主成分</text>

    <text x="655" y="225" font-family="Arial, sans-serif" font-size="24" fill="#E8E0D4">→</text>

    <rect x="680" y="165" width="160" height="110" rx="10" fill="#3D8B5E" fill-opacity="0.12"/>
    <text x="760" y="210" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#3D8B5E" text-anchor="middle">模型预测</text>
    <text x="760" y="240" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#8C8578" text-anchor="middle">回归模型</text>

    <text x="855" y="225" font-family="Arial, sans-serif" font-size="24" fill="#E8E0D4">→</text>

    <rect x="880" y="165" width="160" height="110" rx="10" fill="#2AA3A0" fill-opacity="0.12"/>
    <text x="960" y="210" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#2AA3A0" text-anchor="middle">PCA 逆变换</text>
    <text x="960" y="240" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#8C8578" text-anchor="middle">还原 41 维</text>

    <text x="1055" y="225" font-family="Arial, sans-serif" font-size="24" fill="#E8E0D4">→</text>

    <rect x="1080" y="165" width="120" height="110" rx="10" fill="#D46B8C" fill-opacity="0.12"/>
    <text x="1140" y="210" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#D46B8C" text-anchor="middle">光谱</text>
    <text x="1140" y="240" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#8C8578" text-anchor="middle">还原曲线</text>
  </g>

  <!-- Explanation -->
  <g id="explain">
    <rect x="60" y="330" width="560" height="260" rx="12" fill="#FFF8EE"/>
    <rect x="60" y="330" width="560" height="5" rx="2" fill="#3D8B5E"/>
    <text x="80" y="370" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#3D8B5E">为什么要这样做</text>
    <text x="80" y="405" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="19" fill="#2D2A26">
      <tspan x="80" dy="0">原始光谱 41 维，相邻波长强相关，</tspan>
      <tspan x="80" dy="30">直接预测维度高、难度大。</tspan>
      <tspan x="80" dy="30">PCA 把主要变化压缩成 5 个系数，</tspan>
      <tspan x="80" dy="30">既保留形状信息（98.3%），</tspan>
      <tspan x="80" dy="30">也便于回归模型学习。</tspan>
    </text>

    <rect x="650" y="330" width="570" height="260" rx="12" fill="#FFF8EE"/>
    <rect x="650" y="330" width="570" height="5" rx="2" fill="#D4940A"/>
    <text x="670" y="370" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#D4940A">关键数字</text>

    <rect x="670" y="395" width="240" height="70" rx="8" fill="#FFF3B0"/>
    <text x="790" y="435" font-family="Consolas, Courier New, monospace" font-size="32" font-weight="bold" fill="#8B6DB0" text-anchor="middle">5</text>
    <text x="790" y="458" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#8C8578" text-anchor="middle">主成分数量</text>

    <rect x="940" y="395" width="240" height="70" rx="8" fill="#FFF3B0"/>
    <text x="1060" y="435" font-family="Consolas, Courier New, monospace" font-size="32" font-weight="bold" fill="#D4940A" text-anchor="middle">98.3%</text>
    <text x="1060" y="458" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#8C8578" text-anchor="middle">累计解释方差</text>

    <text x="670" y="510" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#8C8578">PCA 不是为了让结果更"高级"，而是为了让模型更容易学习。</text>
  </g>

  <g id="footer">
    <text x="60" y="690" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12" fill="#B0A898">基于真实天光数据的自然光光谱估计与室内照明补偿设计</text>
    <text x="1220" y="690" font-family="Arial, sans-serif" font-size="12" fill="#B0A898" text-anchor="end">08 / 15</text>
  </g>
</svg>