<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="tealAccent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2AA3A0"/>
      <stop offset="100%" stop-color="#2AA3A0" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="#FDFBF7"/>

  <!-- Header -->
  <g id="header">
    <text x="60" y="50" font-family="Arial, sans-serif" font-size="11" fill="#B0A898">COURSE DEFENSE · 06</text>
    <rect x="60" y="65" width="50" height="3" rx="1.5" fill="#2AA3A0"/>
    <text x="60" y="100" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="bold" fill="#2D2A26">模型输出：41 维相对光谱</text>
  </g>

  <!-- Left: Spectrum image -->
  <g id="spectrum-chart">
    <rect x="60" y="130" width="560" height="400" rx="12" fill="#FFF8EE"/>
    <image href="../images/base_spectrum.png" x="70" y="140" width="540" height="340" preserveAspectRatio="xMidYMid meet"/>
    <text x="80" y="510" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="13" fill="#8C8578">光谱曲线示例：380–780 nm 范围内的相对光谱</text>
  </g>

  <!-- Right: Text content -->
  <g id="content">
    <rect x="650" y="130" width="570" height="400" rx="12" fill="#FFF8EE"/>

    <text x="670" y="175" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2AA3A0">输出目标</text>

    <text x="670" y="210" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#2D2A26">
      <tspan x="670" dy="0">380–780 nm 可见光范围</tspan>
      <tspan x="670" dy="28">每 10 nm 一个点，共 41 维</tspan>
      <tspan x="670" dy="28">关注相对光谱形状</tspan>
    </text>

    <line x1="670" y1="310" x2="1180" y2="310" stroke="#E8E0D4" stroke-width="1"/>

    <text x="670" y="345" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2AA3A0">为什么需要 PCA</text>

    <text x="670" y="380" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" fill="#2D2A26">
      <tspan x="670" dy="0">光谱曲线连续变化，相邻波长</tspan>
      <tspan x="670" dy="28">高度相关 → 适合 PCA 压缩</tspan>
      <tspan x="670" dy="28">直接预测 41 维会增加模型难度</tspan>
    </text>

    <line x1="670" y1="475" x2="1180" y2="475" stroke="#E8E0D4" stroke-width="1"/>

    <text x="670" y="505" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#8C8578">每条光谱除以自身最大值，模型学习光谱形状而非绝对强度</text>
  </g>

  <!-- Footer -->
  <g id="footer">
    <text x="60" y="690" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#B0A898">基于真实天光数据的自然光光谱估计与室内照明补偿设计</text>
    <text x="1220" y="690" font-family="Arial, sans-serif" font-size="11" fill="#B0A898" text-anchor="end">06 / 13</text>
  </g>
</svg>