<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B6DB0"/>
      <stop offset="100%" stop-color="#8B6DB0" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="#FDFBF7"/>

  <!-- Header -->
  <g id="header">
    <text x="60" y="50" font-family="Arial, sans-serif" font-size="11" fill="#B0A898">COURSE DEFENSE · 07</text>
    <rect x="60" y="65" width="50" height="3" rx="1.5" fill="#8B6DB0"/>
    <text x="60" y="100" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="bold" fill="#2D2A26">用 PCA 压缩光谱，保留主要变化信息</text>
  </g>

  <!-- Flow diagram -->
  <g id="pca-flow">
    <rect x="60" y="130" width="1160" height="100" rx="12" fill="#FFF8EE"/>

    <rect x="80" y="150" width="140" height="60" rx="8" fill="#8B6DB0" fill-opacity="0.15"/>
    <text x="150" y="185" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#8B6DB0" text-anchor="middle">原始光谱</text>

    <text x="235" y="185" font-family="Arial, sans-serif" font-size="20" fill="#E8E0D4">→</text>

    <rect x="260" y="150" width="120" height="60" rx="8" fill="#8B6DB0" fill-opacity="0.15"/>
    <text x="320" y="185" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#8B6DB0" text-anchor="middle">PCA 降维</text>

    <text x="395" y="185" font-family="Arial, sans-serif" font-size="20" fill="#E8E0D4">→</text>

    <rect x="420" y="150" width="160" height="60" rx="8" fill="#8B6DB0" fill-opacity="0.15"/>
    <text x="500" y="185" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#8B6DB0" text-anchor="middle">5 个主成分系数</text>

    <text x="595" y="185" font-family="Arial, sans-serif" font-size="20" fill="#E8E0D4">→</text>

    <rect x="620" y="150" width="120" height="60" rx="8" fill="#8B6DB0" fill-opacity="0.15"/>
    <text x="680" y="185" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#8B6DB0" text-anchor="middle">模型预测</text>

    <text x="755" y="185" font-family="Arial, sans-serif" font-size="20" fill="#E8E0D4">→</text>

    <rect x="780" y="150" width="160" height="60" rx="8" fill="#8B6DB0" fill-opacity="0.15"/>
    <text x="860" y="185" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#8B6DB0" text-anchor="middle">PCA 逆变换</text>

    <text x="955" y="185" font-family="Arial, sans-serif" font-size="20" fill="#E8E0D4">→</text>

    <rect x="980" y="150" width="140" height="60" rx="8" fill="#8B6DB0" fill-opacity="0.2"/>
    <text x="1050" y="185" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold" fill="#8B6DB0" text-anchor="middle">还原光谱</text>
  </g>

  <!-- PCA variance chart -->
  <g id="pca-chart">
    <rect x="60" y="260" width="600" height="340" rx="12" fill="#FFF8EE"/>
    <text x="80" y="295" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#8B6DB0">PCA 解释方差</text>
    <image href="../images/pca_variance.png" x="70" y="310" width="580" height="270" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <!-- Key numbers -->
  <g id="key-numbers">
    <rect x="690" y="260" width="530" height="340" rx="12" fill="#FFF8EE"/>

    <text x="710" y="305" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#8B6DB0">前 5 个主成分</text>

    <!-- PC1 -->
    <rect x="710" y="325" width="490" height="45" rx="6" fill="#8B6DB0" fill-opacity="0.1"/>
    <text x="730" y="353" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#2D2A26">PC1</text>
    <rect x="790" y="335" width="350" height="25" rx="4" fill="#8B6DB0" fill-opacity="0.3"/>
    <text x="1150" y="353" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="bold" fill="#8B6DB0" text-anchor="end">84.03%</text>

    <!-- PC2 -->
    <rect x="710" y="380" width="490" height="45" rx="6" fill="#8B6DB0" fill-opacity="0.1"/>
    <text x="730" y="408" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#2D2A26">PC2</text>
    <rect x="790" y="390" width="40" height="25" rx="4" fill="#8B6DB0" fill-opacity="0.3"/>
    <text x="1150" y="408" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="bold" fill="#8B6DB0" text-anchor="end">6.64%</text>

    <!-- PC3 -->
    <rect x="710" y="435" width="490" height="45" rx="6" fill="#8B6DB0" fill-opacity="0.1"/>
    <text x="730" y="463" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#2D2A26">PC3</text>
    <rect x="790" y="445" width="22" height="25" rx="4" fill="#8B6DB0" fill-opacity="0.3"/>
    <text x="1150" y="463" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="bold" fill="#8B6DB0" text-anchor="end">3.34%</text>

    <!-- PC4 -->
    <rect x="710" y="490" width="490" height="45" rx="6" fill="#8B6DB0" fill-opacity="0.1"/>
    <text x="730" y="518" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#2D2A26">PC4</text>
    <rect x="790" y="500" width="16" height="25" rx="4" fill="#8B6DB0" fill-opacity="0.3"/>
    <text x="1150" y="518" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="bold" fill="#8B6DB0" text-anchor="end">2.42%</text>

    <!-- PC5 -->
    <rect x="710" y="545" width="490" height="45" rx="6" fill="#8B6DB0" fill-opacity="0.1"/>
    <text x="730" y="573" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#2D2A26">PC5</text>
    <rect x="790" y="555" width="13" height="25" rx="4" fill="#8B6DB0" fill-opacity="0.3"/>
    <text x="1150" y="573" font-family="Consolas, Courier New, monospace" font-size="15" font-weight="bold" fill="#8B6DB0" text-anchor="end">1.91%</text>

    <!-- Cumulative -->
    <line x1="710" y1="600" x2="1200" y2="600" stroke="#E8E0D4" stroke-width="1"/>
    <text x="730" y="625" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="bold" fill="#8B6DB0">累计解释方差</text>
    <text x="1150" y="625" font-family="Consolas, Courier New, monospace" font-size="22" font-weight="bold" fill="#8B6DB0" text-anchor="end">98.35%</text>
  </g>

  <!-- Footer -->
  <g id="footer">
    <text x="60" y="690" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#B0A898">基于真实天光数据的自然光光谱估计与室内照明补偿设计</text>
    <text x="1220" y="690" font-family="Arial, sans-serif" font-size="11" fill="#B0A898" text-anchor="end">07 / 13</text>
  </g>
</svg>