<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3D8B5E"/>
      <stop offset="100%" stop-color="#3D8B5E" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="#FDFBF7"/>

  <!-- Header -->
  <g id="header">
    <text x="60" y="50" font-family="Arial, sans-serif" font-size="11" fill="#B0A898">COURSE DEFENSE · 04</text>
    <rect x="60" y="65" width="50" height="3" rx="1.5" fill="#3D8B5E"/>
    <text x="60" y="100" font-family="Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="bold" fill="#2D2A26">把真实观测数据整理成可训练的数据表</text>
  </g>

  <!-- Three data source cards -->
  <g id="data-sources">
    <!-- Card 1: SKYSPECTRA -->
    <rect x="60" y="140" width="370" height="200" rx="12" fill="#FFF8EE"/>
    <rect x="60" y="140" width="370" height="4" rx="2" fill="#3D8B5E"/>
    <text x="80" y="180" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#3D8B5E">SKYSPECTRA 实测天光光谱</text>
    <text x="80" y="210" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#2D2A26">Zenodo record 8147546</text>
    <text x="80" y="235" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#2D2A26">水平天光光谱 + 站点、时间、</text>
    <text x="80" y="260" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#2D2A26">天空状况、太阳位置元数据</text>
    <text x="80" y="290" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8C8578">重采样到 380–780 nm / 10 nm</text>

    <!-- Card 2: Open-Meteo -->
    <rect x="455" y="140" width="370" height="200" rx="12" fill="#FFF8EE"/>
    <rect x="455" y="140" width="370" height="4" rx="2" fill="#3D8B5E"/>
    <text x="475" y="180" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#3D8B5E">Open-Meteo 历史天气 API</text>
    <text x="475" y="210" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#2D2A26">按观测站经纬度和日期范围查询</text>
    <text x="475" y="235" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#2D2A26">云量、湿度、温度、降水</text>
    <text x="475" y="260" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#2D2A26">按最近整点与光谱测量对齐</text>

    <!-- Card 3: LED Spectrum -->
    <rect x="850" y="140" width="370" height="200" rx="12" fill="#FFF8EE"/>
    <rect x="850" y="140" width="370" height="4" rx="2" fill="#3D8B5E"/>
    <text x="870" y="180" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#3D8B5E">公开 LED 光谱数据</text>
    <text x="870" y="210" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#2D2A26">用于构造七通道 LED 补偿模型</text>
    <text x="870" y="235" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="15" fill="#2D2A26">深蓝、青、绿、琥珀、红、暖白、冷白</text>
    <text x="870" y="260" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14" fill="#8C8578">只用于应用补偿，不参与模型训练</text>
  </g>

  <!-- Processing flow -->
  <g id="process-flow">
    <text x="60" y="380" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#2D2A26">处理流程</text>
    <rect x="60" y="400" width="160" height="50" rx="8" fill="#3D8B5E" fill-opacity="0.1"/>
    <text x="140" y="430" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#3D8B5E" text-anchor="middle">文件合并</text>

    <text x="230" y="430" font-family="Arial, sans-serif" font-size="18" fill="#E8E0D4">→</text>

    <rect x="250" y="400" width="160" height="50" rx="8" fill="#3D8B5E" fill-opacity="0.1"/>
    <text x="330" y="430" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#3D8B5E" text-anchor="middle">时间对齐</text>

    <text x="420" y="430" font-family="Arial, sans-serif" font-size="18" fill="#E8E0D4">→</text>

    <rect x="440" y="400" width="160" height="50" rx="8" fill="#3D8B5E" fill-opacity="0.1"/>
    <text x="520" y="430" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#3D8B5E" text-anchor="middle">波长重采样</text>

    <text x="610" y="430" font-family="Arial, sans-serif" font-size="18" fill="#E8E0D4">→</text>

    <rect x="630" y="400" width="160" height="50" rx="8" fill="#3D8B5E" fill-opacity="0.1"/>
    <text x="710" y="430" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#3D8B5E" text-anchor="middle">缺失值处理</text>

    <text x="800" y="430" font-family="Arial, sans-serif" font-size="18" fill="#E8E0D4">→</text>

    <rect x="820" y="400" width="160" height="50" rx="8" fill="#3D8B5E" fill-opacity="0.1"/>
    <text x="900" y="430" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#3D8B5E" text-anchor="middle">特征编码</text>

    <text x="990" y="430" font-family="Arial, sans-serif" font-size="18" fill="#E8E0D4">→</text>

    <rect x="1010" y="400" width="160" height="50" rx="8" fill="#3D8B5E" fill-opacity="0.15"/>
    <text x="1090" y="430" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold" fill="#3D8B5E" text-anchor="middle">建模数据表</text>
  </g>

  <!-- Key numbers -->
  <g id="key-numbers">
    <rect x="60" y="490" width="1160" height="100" rx="12" fill="#FFF8EE"/>
    <text x="200" y="540" font-family="Consolas, Courier New, monospace" font-size="40" font-weight="bold" fill="#3D8B5E" text-anchor="middle">5664</text>
    <text x="200" y="565" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#8C8578" text-anchor="middle">样本量</text>

    <text x="420" y="540" font-family="Consolas, Courier New, monospace" font-size="40" font-weight="bold" fill="#3D8B5E" text-anchor="middle">41</text>
    <text x="420" y="565" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#8C8578" text-anchor="middle">光谱维度</text>

    <text x="640" y="540" font-family="Consolas, Courier New, monospace" font-size="40" font-weight="bold" fill="#3D8B5E" text-anchor="middle">2016–2018</text>
    <text x="640" y="565" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#8C8578" text-anchor="middle">时间范围</text>

    <text x="880" y="540" font-family="Consolas, Courier New, monospace" font-size="40" font-weight="bold" fill="#3D8B5E" text-anchor="middle">2</text>
    <text x="880" y="565" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#8C8578" text-anchor="middle">观测站</text>

    <text x="1080" y="540" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#2D2A26" text-anchor="middle">法国沃昂夫兰</text>
    <text x="1080" y="565" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#8C8578" text-anchor="middle">主要站点</text>
  </g>

  <!-- Footer -->
  <g id="footer">
    <text x="60" y="690" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="11" fill="#B0A898">基于真实天光数据的自然光光谱估计与室内照明补偿设计</text>
    <text x="1220" y="690" font-family="Arial, sans-serif" font-size="11" fill="#B0A898" text-anchor="end">04 / 13</text>
  </g>
</svg>